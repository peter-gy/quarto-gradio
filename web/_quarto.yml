project:
  type: website
  output-dir: _site
  resources:
    - "guide/use-with-jupyter/notebook-gradio.ipynb"
  render:
    - "*.qmd"
    - "concepts/**/*.qmd"
    - "guide/index.qmd"
    - "guide/*/index.qmd"
    - "guide/use-with-jupyter/notebook-gradio.ipynb"
    - "guide/use-with-revealjs/reveal-gradio-lite*.qmd"
    - "playground/**/*.qmd"
    - "reference/**/*.qmd"

website:
  title: "quarto-gradio"
  favicon: public/favicon.png
  open-graph:
    locale: en_US
    site-name: "quarto-gradio"
  twitter-card: true
  site-url: https://quarto-gradio.peter.gy
  repo-url: https://github.com/peter-gy/quarto-gradio
  page-navigation: true
  back-to-top-navigation: false
  bread-crumbs: true

  search:
    show-item-context: true
    type: overlay
  llms-txt: true

  sidebar:
    style: docked
    collapse-level: 2
    logo: public/quarto-gradio.png
    logo-alt: "quarto-gradio logo"
    background: dark
    alignment: center
    contents:
      - section: "Start here"
        href: index.qmd
        contents:
          - text: "Overview"
            href: index.qmd

          - text: "Quickstart"
            href: guide/get-started/index.qmd

          - text: "How it Works"
            href: concepts/how-it-works/index.qmd

          - text: "Runtime and Trust"
            href: concepts/runtime/index.qmd

      - text: "---"

      - section: "Guides"
        href: guide/index.qmd
        contents:
          - text: "Build a Coding Playground"
            href: guide/enable-coding-playground/index.qmd

          - text: "Install Python Packages"
            href: guide/customize-python-modules/index.qmd

          - text: "Define Multiple Apps"
            href: guide/define-multiple-apps/index.qmd

          - text: "Use a Jupyter Notebook"
            href: guide/use-with-jupyter/index.qmd

          - text: "Use Reveal.js"
            href: guide/use-with-revealjs/index.qmd

          - text: "Match Document Styles"
            href: guide/customize-styles/index.qmd

          - text: "Publish to Static Hosting"
            href: guide/publish/index.qmd

      - text: "---"

      - section: "Examples"
        href: playground/index.qmd
        contents:
          - text: "Example Gallery"
            href: playground/index.qmd

          - section: "Text"
            contents:
              - text: "Sentence Builder"
                href: playground/text/sentence-builder.qmd
              
              - text: "Diff Texts"
                href: playground/text/diff-texts.qmd
          
          - section: "Media"
            contents:
              - text: "Sepia Filter"
                href: playground/media/sepia-filter.qmd

              - text: "Video Identity"
                href: playground/media/video-identity.qmd

              - text: "Generate Tone"
                href: playground/media/generate-tone.qmd
          
          - section: "Tables and Plots"
            contents:
              - text: "Filter Records"
                href: playground/tabular/filter-records.qmd
              
              - text: "Transpose Matrix"
                href: playground/tabular/transpose-matrix.qmd

              - text: "Kinematics"
                href: playground/tabular/kinematics.qmd
          
          - section: "Component Layouts"
            contents:
              - text: "Layouts"
                href: playground/design/layouts.qmd
              
              - text: "Tabbed Interface"
                href: playground/design/tabbed-interface.qmd
          
          - section: "Chat"
            contents:
              - text: "Chatbot"
                href: playground/chatbots/chatbot.qmd

              - text: "Streaming Chatbot"
                href: playground/chatbots/streaming-chatbot.qmd

              - text: "Tool Status Messages"
                href: playground/chatbots/chatbot-with-tools.qmd

              - text: "Chatbot with Artifacts"
                href: playground/chatbots/chatbot-with-artifacts.qmd
          
          - section: "External Models"
            contents:
              - text: "Sentiment Analysis"
                href: playground/transformers/sentiment-analysis.qmd

      - text: "---"

      - section: "Reference"
        href: reference/index.qmd
        contents:
          - text: "Configuration"
            href: reference/index.qmd

          - text: "Troubleshooting"
            href: reference/troubleshooting.qmd
    
    tools:
      - icon: github
        aria-label: Repository links
        menu:
          - text: Source Code
            icon: "code"
            href:  https://github.com/peter-gy/quarto-gradio
          
          - text: Report a Bug
            icon: "bug"
            href:  https://github.com/peter-gy/quarto-gradio/issues/new/choose
          
          - text: Ask a Question
            icon: "chat-right-text"
            href: "https://github.com/peter-gy/quarto-gradio/discussions"
  
  page-footer:
    background: dark
    border: true
    left: |
      Made by [Péter Ferenc Gyarmati](https://peter.gy) · Powered by [Quarto](https://quarto.org)<sup>®</sup>
    right: 
      - icon: github
        href: https://l.peter.gy/github
        aria-label: GitHub profile
      - icon: linkedin 
        href: https://l.peter.gy/in
        aria-label: LinkedIn profile
      - icon: globe 
        href: https://peter.gy
        aria-label: Personal website

format:
  html:
    highlight-style: a11y
    toc: true
    code-copy: true
    code-fold: true
    code-overflow: wrap
    theme: darkly
    css: styles.css
    include-in-header:
      - analytics.html
    grid:
      sidebar-width: 300px
      body-width: 800px
      margin-width: 200px

filters:
  - gradio

execute:
  enabled: false
